version: '3.8'

services:
  # Admin App (Upload Documents)
  admin-app:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./admin-app:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - app-network

  # User App (Chat Interface)
  user-app:
    build:
      context: ./user-app
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./user-app:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - app-network

  # JSON Server (Mock API)
  json-server:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./db.json:/app/db.json
      - ./package.json:/app/package.json
    ports:
      - "8009:8009"
    command: >
      sh -c "
        npm install -g json-server &&
        json-server --watch db.json --port 8009 --host 0.0.0.0
      "
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge